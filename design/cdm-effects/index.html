<title>ModeCDM Icon Effects</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench. Sticky header with save state and tabs; the Bench tab is a
   two-pane rig (simulated CDM with fight controls left, the effect editor right). */
:root {
  color-scheme: dark;
  --void: #0b0c0e;
  --panel: #131417;
  --raised: #1a1c20;
  --sunk: #0f1012;
  --line: #2a2d32;
  --line-soft: #202226;
  --text: #dcdcdc;
  --muted: #8d9198;
  --faint: #5d6168;
  --ivory: #efe6d2;
  --brand: #e2b866;
  --celadon: #b4cdb6;
  --rosewood: #cf6a6f;
  --hot: #ff3948;
  --amber: #ffb12f;
  --power-tint: #759acd;
  --graphite-muted: #85858b;
  --empty-rim: #343438;
  --font-game: "Urbanist", "Inter", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
* { box-sizing: border-box; }
body { background: var(--void); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--brand); }
h1, h2, h3, h4 { font-family: var(--font-game); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 22px; font-weight: 700; color: var(--ivory); }
h3 { font-size: 15px; font-weight: 700; color: var(--ivory); }
h4 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
p { margin: 0; max-width: 74ch; }
code, .mono { font-family: var(--font-mono); font-size: 12px; }
code { background: var(--sunk); border: 1px solid var(--line-soft); padding: 0 4px; border-radius: 3px; color: #c9c3b6; overflow-wrap: anywhere; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
ul { margin: 0; padding-left: 18px; }
li { margin: 3px 0; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in, .wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-game); font-weight: 800; font-size: 19px; letter-spacing: .02em; }
.brand b { color: var(--brand); font-weight: 800; }
.brand span { color: #fff; }
.brand small { font-family: var(--font-ui); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.spacer { flex: 1; }
.save-state { font-size: 12px; color: var(--muted); }
.save-state.dirty { color: var(--amber); }
.save-state.ok { color: var(--celadon); }
.btn { background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: #3d4148; }
.btn.primary { background: #2a2418; border-color: #5b4a2a; color: var(--brand); }
.btn.primary:hover { border-color: var(--brand); }
.btn.on { border-color: var(--brand); color: var(--brand); background: #221e15; }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: default; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-family: var(--font-game); font-weight: 700; font-size: 14px; white-space: nowrap; letter-spacing: .02em; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--ivory); border-bottom-color: var(--brand); }

main .wrap { padding-block: 22px 60px; }
section.view { display: grid; gap: 18px; }
.lede { color: var(--muted); max-width: 80ch; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card.sunk { background: var(--sunk); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.fm { color: var(--celadon); border-color: #3b4a3d; }
.chip.fo { color: var(--brand); border-color: #5b4a2a; }
.chip.ck { color: var(--amber); border-color: #5a4320; }
.chip.rc { color: var(--rosewood); border-color: #5a2e31; }
.chip.ex { color: var(--ivory); border-color: #4a4639; }
.chip.nw { color: #9fc3ff; border-color: #2c3e5c; }
.note { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { font-family: var(--font-game); font-weight: 700; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; background: var(--sunk); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td .sub { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
select.mini, input.mini { background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font-size: 12px; }
textarea.notes { width: 100%; min-height: 64px; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 8px; font-size: 13px; resize: vertical; }

/* Bench ------------------------------------------------------------------ */
.bench { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .bench { grid-template-columns: 1fr; } }
.stage { background: radial-gradient(120% 90% at 50% 20%, #1b1d22 0%, #0d0e10 70%); border: 1px solid var(--line); border-radius: 6px; padding: 18px 14px; display: grid; gap: 14px; justify-items: center; min-height: 300px; position: relative; overflow: hidden; }
.stage-label { justify-self: start; font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.row { display: flex; gap: var(--gap, 1px); justify-content: center; flex-wrap: wrap; }
.ic { position: relative; width: calc(var(--w) * var(--z)); height: calc(var(--h) * var(--z)); cursor: pointer; flex: none; transition: opacity .15s; }
.ic .art { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-game); font-weight: 800; color: rgba(255,255,255,.9); font-size: calc(9px * var(--z)); letter-spacing: .02em; text-shadow: 0 1px 2px #000; overflow: hidden; transition: filter .15s; }
.ic .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.18), transparent 45%, rgba(0,0,0,.35)); }
.ic .tint { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0; pointer-events: none; }
.ic .swipe { position: absolute; inset: 0; pointer-events: none; }
.ic .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-game); font-weight: 800; font-size: calc(var(--fs) * var(--z)); color: var(--amber); -webkit-text-stroke: calc(.6px * var(--z)) #000; paint-order: stroke fill; pointer-events: none; }
.ic .cnt { position: absolute; right: calc(2px * var(--z)); bottom: 0; font-family: var(--font-game); font-weight: 800; font-size: calc(10px * var(--z)); color: #f2f2f2; -webkit-text-stroke: calc(.5px * var(--z)) #000; paint-order: stroke fill; pointer-events: none; }
.ic .edge { position: absolute; inset: calc(-1px * var(--z)); border: calc(1px * var(--z)) solid #4e5156; box-shadow: 0 0 0 calc(1px * var(--z)) #000; pointer-events: none; }
.ic .glow, .ic .gl { position: absolute; pointer-events: none; }
.ic .glow { inset: 0; }
.ic .gl { inset: 0; --c: var(--brand); }
.ic.sel::before { content: ""; position: absolute; inset: calc(-5px * var(--z)); border: 1px dashed rgba(226,184,102,.65); border-radius: 2px; pointer-events: none; }
.ic.pulse .glow { animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .35; } }
.ic.pop { animation: pop .32s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.ic.shake { animation: shake .4s linear; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-3px); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
.ic.flash .art { animation: flash .5s ease-out; }
@keyframes flash { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
.g-mode { box-shadow: 0 0 calc(5px * var(--z)) calc(2px * var(--z)) var(--c), inset 0 0 calc(4px * var(--z)) var(--c); opacity: .95; }
.g-border { box-shadow: inset 0 0 0 calc(1.5px * var(--z)) var(--c); }
.g-border::after { content: ""; position: absolute; inset: calc(-1px * var(--z)); border: calc(1px * var(--z)) solid var(--c); }
.g-pixel { inset: calc(-2px * var(--z)) !important;
  background:
    linear-gradient(90deg, var(--c) 50%, transparent 0) repeat-x top left / calc(8px * var(--z)) calc(2px * var(--z)),
    linear-gradient(90deg, var(--c) 50%, transparent 0) repeat-x bottom left / calc(8px * var(--z)) calc(2px * var(--z)),
    linear-gradient(0deg, var(--c) 50%, transparent 0) repeat-y top left / calc(2px * var(--z)) calc(8px * var(--z)),
    linear-gradient(0deg, var(--c) 50%, transparent 0) repeat-y top right / calc(2px * var(--z)) calc(8px * var(--z));
  animation: march .7s linear infinite; }
@keyframes march { to { background-position: calc(8px * var(--z)) 0, calc(-8px * var(--z)) 100%, 0 calc(-8px * var(--z)), 100% calc(8px * var(--z)); } }
.g-blizzard { inset: calc(-4px * var(--z)) !important; border-radius: 3px; box-shadow: 0 0 0 calc(2px * var(--z)) var(--c), 0 0 calc(9px * var(--z)) calc(3px * var(--z)) var(--c); animation: flicker .9s steps(6) infinite; }
@keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
.g-gcd { inset: calc(-3px * var(--z)) !important; padding: calc(2px * var(--z)); background: conic-gradient(from var(--a), var(--c), transparent 25%, var(--c) 50%, transparent 75%, var(--c));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); animation: spin 1.4s linear infinite; }
@keyframes spin { to { --a: 360deg; } }
@media (prefers-reduced-motion: reduce) { .ic.pulse .glow, .g-pixel, .g-blizzard, .g-gcd, .ic.pop, .ic.shake, .ic.flash .art { animation: none !important; } }

.controls { display: grid; gap: 10px; }
.ctl-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ctl-row > .lbl { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; min-width: 64px; }
.log { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); background: var(--sunk); border: 1px solid var(--line-soft); border-radius: 4px; padding: 8px; height: 112px; overflow-y: auto; }
.log b { color: var(--ivory); font-weight: 500; }
.res { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.res .bar { width: 160px; height: 8px; background: #1e1f22; border: 1px solid #000; position: relative; }
.res .bar i { position: absolute; inset: 0 auto 0 0; background: var(--amber); }
.cps { display: inline-flex; gap: 3px; }
.cps i { width: 9px; height: 9px; border-radius: 50%; background: #2a2b2e; border: 1px solid #000; }
.cps i.on { background: #f05454; }
.statebar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 22px; }

.editor { display: grid; gap: 12px; }
.ed-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.layer { display: grid; gap: 4px; }
.erow { display: grid; grid-template-columns: 22px minmax(96px, 1.1fr) minmax(0, 1fr) 34px auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line-soft); }
.erow.dim { opacity: .5; }
.erow.own { border-color: #5b4a2a; }
.erow .nm { font-size: 13px; font-weight: 600; color: var(--ivory); line-height: 1.2; }
.erow .nm small { display: block; font-weight: 400; color: var(--faint); font-size: 11px; }
.erow .opts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.erow input[type=color] { width: 30px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: none; cursor: pointer; }
.erow input[type=checkbox] { accent-color: var(--brand); width: 15px; height: 15px; }
.erow label.tiny { font-size: 11px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.erow .src { font-size: 11px; }
.erow .src button { background: none; border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; cursor: pointer; color: var(--muted); font-size: 11px; }
.erow .src button.own { color: var(--brand); border-color: #5b4a2a; }
@media (max-width: 560px) { .erow { grid-template-columns: 22px 1fr 34px; } .erow .opts, .erow .src { grid-column: 2 / -1; } }
.prio { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.prio b { color: var(--ivory); font-weight: 600; }

/* Options mockups ------------------------------------------------------- */
.opt { display: grid; gap: 10px; }
.opt-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.opt-head h3 { font-size: 17px; }
.mock { background: #0b0b0c; border: 1px solid #2c2c2f; border-radius: 4px; padding: 12px; font-size: 12px; color: #d8d8db; display: grid; gap: 8px; font-family: var(--font-game); }
.mock .mh { font-weight: 700; color: #a9a9ae; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.mock .mrow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: #121213; border: 1px solid #222224; border-radius: 3px; flex-wrap: wrap; }
.mock .mrow .grow { flex: 1; min-width: 60px; }
.mock .pill { padding: 1px 8px; border-radius: 3px; border: 1px solid #3d3d41; font-size: 11px; color: #d8d8db; background: #1a1a1c; white-space: nowrap; }
.mock .pill.gold { border-color: #6b5530; color: var(--brand); }
.mock .pill.dim { color: #85858b; }
.mock .sw { width: 14px; height: 14px; border-radius: 2px; border: 1px solid #000; flex: none; }
.mock .mini-ic { width: 30px; height: 24px; position: relative; flex: none; display: grid; place-items: center; font-size: 8px; font-weight: 800; color: #fff; border: 1px solid #4e5156; }
.mock .strip { display: flex; gap: 8px; flex-wrap: wrap; }
.mock .strip .st { display: grid; justify-items: center; gap: 3px; padding: 6px; border: 1px solid #222224; border-radius: 3px; background: #121213; font-size: 10px; color: #a9a9ae; cursor: default; }
.mock .strip .st.sel { border-color: #6b5530; color: var(--brand); }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
.pc h4 { margin-bottom: 4px; }
.pc .pro li::marker { color: var(--celadon); }
.pc .con li::marker { color: var(--rosewood); }
@media (max-width: 600px) { .pc { grid-template-columns: 1fr; } }
.pick { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.pick input { accent-color: var(--brand); }
.rec { color: var(--brand); font-size: 12px; font-weight: 600; }

.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.swatch { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; background: var(--sunk); border: 1px solid var(--line-soft); border-radius: 5px; padding: 8px; }
.swatch .chipc { width: 44px; height: 36px; border-radius: 3px; border: 1px solid #000; position: relative; overflow: hidden; }
.swatch input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.swatch .t { font-size: 13px; color: var(--ivory); font-weight: 600; line-height: 1.25; }
.swatch .t small { display: block; color: var(--faint); font-weight: 400; font-family: var(--font-mono); font-size: 11px; }

.phase { display: grid; gap: 8px; }
.phase ol { margin: 0; padding-left: 20px; }
.files { display: grid; gap: 4px; font-size: 13px; }
.files div { display: grid; grid-template-columns: minmax(150px, 230px) 1fr; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line-soft); }
.files div:last-child { border-bottom: 0; }
@media (max-width: 600px) { .files div { grid-template-columns: 1fr; gap: 2px; } }
.q { display: grid; gap: 6px; padding: 10px; background: var(--sunk); border: 1px solid var(--line-soft); border-radius: 5px; }
.q .qt { font-weight: 600; color: var(--ivory); font-size: 13px; }
.q .qa { display: flex; gap: 12px; flex-wrap: wrap; }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Mode</b><span>CDM</span> <small>Icon Effects · research and plan · Nov 25, 2026</small></div>
    <div class="spacer"></div>
    <span class="save-state" id="saveState">Connecting…</span>
    <button class="btn" id="resetBtn" type="button">Reset to proposal</button>
    <button class="btn primary" id="saveBtn" type="button">Save choices</button>
  </div>
  <div class="top-in" style="padding-block:0">
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main><div class="wrap" id="views"></div></main>

<script>
(function () {
"use strict";
/* ---------- Data --------------------------------------------------------- */
var TONE = { brand: "#e2b866", ivory: "#efe6d2", celadon: "#b4cdb6", rosewood: "#cf6a6f", amber: "#ffb12f", hot: "#ff3948",
  powerTint: "#759acd", muted: "#85858b", auraGlow: "#ffd15c" };
var LOOKS = {
  glow: [["off", "Off"], ["mode", "Mode Glow"], ["border", "Border"], ["pixel", "Pixel"], ["blizzard", "Blizzard"], ["gcd", "GCD"]],
  icon: [["off", "Off"], ["tint", "Tint"], ["gray", "Gray"], ["fade", "Fade"]],
  text: [["off", "Off"], ["color", "Color the numbers"]]
};
var MOTIONS = [["none", "No motion"], ["pop", "Pop"], ["flash", "Flash"], ["shake", "Shake"]];
var SOUNDS = [["none", "No sound"], ["warning", "Blizzard Warning"], ["ready", "Ready chime"]];

/* Each state: when it applies, its layer, the proposed default, and its tags. */
var STATES = [
  { id: "proc", label: "Proc", layer: "glow", on: "cooldown", when: "The game lights the spell up (its spell alert).",
    def: { on: true, look: "mode", color: TONE.brand, pulse: false, motion: "pop", sound: "none" }, status: "exists", tag: "fm",
    detect: "ActionButtonSpellAlertManager:ShowAlert/HideAlert hooked on Blizzard's items; SPELL_ACTIVATION_OVERLAY_GLOW_SHOW/HIDE for ModeUI's own icons." },
  { id: "usable", label: "Usable", layer: "glow", on: "cooldown", when: "A spell that couldn't be cast becomes castable: Riposte after a parry, Overpower after a dodge, Execute under 20%.",
    def: { on: true, look: "pixel", color: TONE.ivory, pulse: false, motion: "pop", sound: "none" }, status: "new", tag: "fm",
    detect: "C_Spell.IsSpellUsable flips from not usable (and not short on power) to usable, on SPELL_UPDATE_USABLE. Starts on only for spells marked reactive." },
  { id: "active", label: "Active", layer: "glow", on: "cooldown", when: "The spell's own effect is up (Evasion, Bloodrage).",
    def: { on: false, look: "border", color: TONE.ivory, pulse: false, motion: "none", sound: "none" }, status: "exists", tag: "fm",
    detect: "Blizzard's gold aura swipe on the item (compared by reference, never secret)." },
  { id: "ready", label: "Ready", layer: "glow", on: "cooldown", when: "A real cooldown ends: a flash for Glow Time, or lit for as long as it's ready.",
    def: { on: false, look: "mode", color: TONE.ivory, pulse: true, motion: "flash", sound: "none", mode: "flash", secs: 2 }, status: "exists", tag: "fm",
    detect: "C_Spell.GetSpellCooldown isActive/isOnGCD (never secret) plus the 0.2 s watch ticker." },
  { id: "charges", label: "Full Charges", layer: "glow", on: "cooldown", when: "Every charge is back, so a recharge is being wasted.",
    def: { on: false, look: "border", color: TONE.amber, pulse: false, motion: "none", sound: "none" }, status: "new", tag: "ck",
    detect: "C_Spell.GetSpellCharges: has charges and isActive (recharging) is false. Both are never secret. Forever spells with charges: check in game." },

    }).catch(function () { clearTimeout(timer); s.textContent = "Saving is unavailable; choices stay in this tab"; });
  })();
};
